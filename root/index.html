<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Cumplimiento - Sur de Jalisco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --reune-blue: #1a2a6c; --redeco-red: #b22222; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Estilo de las Tarjetas de Selección */
        .system-card {
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            height: 100%;
        }
        .system-card:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }
        .logo-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #fff;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-footer-reune { background: var(--reune-blue); color: white; padding: 15px; }
        .card-footer-redeco { background: var(--redeco-red); color: white; padding: 15px; }
        
        /* Utilidades */
        .d-none { display: none !important; }
        .login-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="login-section" class="container login-bg">
        <div class="col-md-4">
            <div class="card border-0 shadow-lg p-4 animate__animated animate__zoomIn" style="border-radius: 20px;">
                <div class="card-body text-center">
                    <h4 class="fw-bold mb-4">Control Regulatorio</h4>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="user" placeholder="Usuario">
                        <label>Usuario</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="pass" placeholder="Contraseña">
                        <label>Contraseña</label>
                    </div>
                    <button class="btn btn-dark w-100 py-3 rounded-pill fw-bold" onclick="login()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboard" class="container py-5 d-none">
        <div class="row mb-5 animate__animated animate__fadeInDown">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold text-dark">Sistemas de Información</h2>
                    <p class="text-muted" id="welcome-text">Bienvenido al panel de gestión</p>
                </div>
                <button class="btn btn-outline-danger px-4 rounded-pill" onclick="logout()">Salir</button>
            </div>
        </div>

        <div class="row justify-content-center g-5">
            <div class="col-md-5 animate__animated animate__fadeInLeft">
                <div class="system-card" onclick="irASistema('reune')">
                    <div class="logo-container">
                        <img src="assets/logos/logo_reune.png" alt="Logotipo REUNE">
                    </div>
                    <div class="card-footer-reune text-center">
                        <h4 class="m-0 fw-bold">Gestionar REUNE</h4>
                        <small>Quejas, Consultas y Aclaraciones</small>
                    </div>
                </div>
            </div>

            <div class="col-md-5 animate__animated animate__fadeInRight">
                <div class="system-card" onclick="irASistema('redeco')">
                    <div class="logo-container">
                        <img src="assets/logos/logo_redeco.png" alt="Logotipo REDECO">
                    </div>
                    <div class="card-footer-redeco text-center">
                        <h4 class="m-0 fw-bold">Gestionar REDECO</h4>
                        <small>Despachos de Cobranza</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
</body>
</html>
